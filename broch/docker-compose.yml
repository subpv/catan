services:
  broch:
    image: broch:latest
    build: .
    container_name: broch
    restart: unless-stopped
    # 568 is the "apps" user on TrueNAS SCALE. Give that user write access to the data dataset.
    user: "568:568"
    ports:
      - "8080:8080"
    environment:
      # Optional: people need this code to create an account (the first account never does).
      REGISTRATION_CODE: ""
      FEEDBACK_URL: "https://feedback.maidev.dk/"   # "" = no feedback link at all
    logging:                      # Docker does not rotate logs by itself
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    volumes:
      - /mnt/tank/apps/broch/data:/data
